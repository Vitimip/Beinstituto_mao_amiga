spring.application.name=Beinstituto_mao_amiga

spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./data/db-api;DB_CLOSE_ON_EXIT=FALSE
spring.h2.console.enabled=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Page serializada como content + page (sem o aviso de serialização do PageImpl)
spring.data.web.pageable.serialization-mode=via_dto
